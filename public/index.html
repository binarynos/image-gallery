<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">▣ Gallery</span>
      <nav class="breadcrumb" id="breadcrumb" aria-label="breadcrumb"></nav>
    </div>
    <div class="topbar-right">
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input"
          placeholder="Search filenames or tags… (try tag:grass)" autocomplete="off" />
        <button class="search-clear" id="searchClear" title="Clear search" hidden>✕</button>
      </div>
      <button class="btn-toggle" id="btnTags" title="Browse tags">
        <span class="btn-label">🏷 Tags</span>
      </button>
      <button class="btn-toggle" id="toggleMasonry" title="Toggle masonry">
        <!-- <span class="icon-eye"></span> -->
        <span class="btn-label">Toggle masonry</span>
      </button>
      <button class="btn-toggle" id="toggleNonImages" title="Toggle non-image files">
        <span class="icon-eye"></span>
        <span class="btn-label">Hide files</span>
      </button>
    </div>
  </header>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="status-bar" id="statusBar"></div>
    <div class="grid" id="grid"></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <!-- ── Lightbox ─────────────────────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <div class="lb-backdrop" id="lbBackdrop"></div>

    <button class="lb-close" id="lbOpenExplorer" aria-label="Open explorer">📁</button>
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous image">‹</button>
    <button class="lb-arrow lb-next" id="lbNext" aria-label="Next image">›</button>

    <div class="lb-stage" id="lbStage">
      <div class="lb-img-wrap" id="lbImgWrap">
        <img class="lb-img" id="lbImg" src="" alt="" draggable="false" />
      </div>
      <div class="lb-spinner" id="lbSpinner"></div>
    </div>

    <!-- Bottom bar: caption, counter, tag editor, zoom/rotate toolbar -->
    <div class="lb-bottom" id="lbBottom">
      <div class="lb-caption" id="lbCaption"></div>
      <div class="lb-counter" id="lbCounter"></div>

      <div class="lb-tags" id="lbTags">
        <div class="lb-tags-list" id="lbTagsList"></div>
        <div class="lb-tags-input-row">
          <input type="text" id="lbTagInput" class="lb-tag-input" placeholder="Add tag… (Enter)" autocomplete="off" />
          <span class="lb-tags-status" id="lbTagsStatus"></span>
        </div>
      </div>

      <div class="lb-toolbar" id="lbToolbar">
        <button class="lb-tool" id="lbZoomOut" title="Zoom out (-)">−</button>
        <span class="lb-zoom-level" id="lbZoomLevel">100%</span>
        <button class="lb-tool" id="lbZoomIn" title="Zoom in (+)">+</button>
        <span class="lb-tool-sep"></span>
        <button class="lb-tool" id="lbRotateLeft" title="Rotate left (Shift+R)">⟲</button>
        <button class="lb-tool" id="lbRotateRight" title="Rotate right (R)">⟳</button>
        <span class="lb-tool-sep"></span>
        <button class="lb-tool" id="lbReset" title="Reset view (0)">⤾ Reset</button>
      </div>
    </div>
  </div>

  <!-- ── Tags modal ───────────────────────────────────────────────────────── -->
  <div class="modal" id="tagsModal" role="dialog" aria-modal="true" aria-label="Browse tags" hidden>
    <div class="modal-backdrop" id="tagsModalBackdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h2>Top tags</h2>
        <button class="modal-close" id="tagsModalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="tagsModalBody">
        <div class="modal-loading">loading…</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
